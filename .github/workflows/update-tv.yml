name: 番組キーワード検索を更新

on:
  workflow_dispatch:
  schedule:
    # GitHub ActionsのcronはUTC基準です。
    # 21:30 UTC = 日本時間 06:30 です。
    - cron: "30 21 * * *"
    # 01:00 UTC = 日本時間 10:00 です。
    - cron: "0 1 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: PHPを準備
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom

      - name: GitHub Pagesを準備
        uses: actions/configure-pages@v5

      - name: 番組検索HTMLを生成
        run: php scripts/build.php

      - name: GitHub Pages用ファイルをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4
